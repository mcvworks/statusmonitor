name: Deploy Monitor

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            REPO="https://github.com/${{ github.repository }}.git"
            REPO_DIR="/home/dt_lower/monitor-repo"

            echo "── Pulling latest code ──"
            if [ -d "$REPO_DIR/.git" ]; then
              cd "$REPO_DIR"
              git fetch origin main
              git reset --hard origin/main
            else
              rm -rf "$REPO_DIR"
              git clone "$REPO" "$REPO_DIR"
              cd "$REPO_DIR"
            fi

            echo "── Installing dependencies ──"
            cd "$REPO_DIR"
            npm install

            echo "── Running database migrations ──"
            npx prisma generate
            npx prisma db push

            echo "── Building Next.js ──"
            npm run build

            echo "── Copying static assets to standalone ──"
            cp -r .next/static .next/standalone/.next/static
            cp -r public .next/standalone/public

            echo "── Clearing port 3000 (nginx upstream) ──"
            # An orphaned statusmonitor instance held :3000 from March to
            # July 2026 while PM2 deploys went to :3001 — deploys passed
            # their health check but the public site never changed.
            if curl -sf --max-time 5 http://127.0.0.1:3000/api/health | grep -q '"providers"'; then
              echo "Old statusmonitor instance found on :3000 — stopping it"
              if command -v docker >/dev/null 2>&1; then
                docker ps -q --filter "publish=3000" | xargs -r docker rm -f || true
              fi
              PIDS=$(ss -ltnp 2>/dev/null | grep ':3000 ' | grep -oE 'pid=[0-9]+' | cut -d= -f2 | sort -u)
              for p in $PIDS; do kill "$p" 2>/dev/null || true; done
              sleep 2
            elif curl -sf --max-time 5 http://127.0.0.1:3000/ >/dev/null 2>&1; then
              echo "ERROR: port 3000 is serving something that is NOT statusmonitor — refusing to kill it."
              echo "Response from :3000/api/health:"
              curl -s --max-time 5 http://127.0.0.1:3000/api/health || true
              exit 1
            fi

            echo "── Reloading PM2 ──"
            pm2 delete statusmonitor 2>/dev/null || true
            pm2 start ecosystem.config.js
            pm2 save

            echo "── Health check (local) ──"
            sleep 3
            curl -sf http://127.0.0.1:3000/api/health || {
              echo "Health check failed!"
              pm2 logs statusmonitor --lines 20 --nostream
              exit 1
            }

            echo "── Health check (public URL) ──"
            # Verify the process serving public traffic is the one we just
            # started — guards against the port-mismatch failure mode
            sleep 2
            PUB_UPTIME=$(curl -sf --max-time 15 https://monitor.ducktyped.xyz/api/health | grep -oE '"uptime":[0-9]+' | cut -d: -f2)
            echo "Public uptime: ${PUB_UPTIME:-unreachable}s"
            if [ -z "$PUB_UPTIME" ] || [ "$PUB_UPTIME" -gt 300 ]; then
              echo "ERROR: public site is not serving the new process (uptime=${PUB_UPTIME:-unreachable})."
              echo "nginx is likely routing to a different port/instance."
              exit 1
            fi

            echo "── Deploy complete ──"
