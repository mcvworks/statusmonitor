name: Deploy Monitor

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        env:
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
          CLOUDFLARE_RADAR_API_KEY: ${{ secrets.CLOUDFLARE_RADAR_API_KEY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GOOGLE_SITE_VERIFICATION,BING_SITE_VERIFICATION,CLOUDFLARE_RADAR_API_KEY
          script: |
            set -e

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            REPO="https://github.com/${{ github.repository }}.git"
            REPO_DIR="/home/dt_lower/monitor-repo"

            echo "── Pulling latest code ──"
            if [ -d "$REPO_DIR/.git" ]; then
              cd "$REPO_DIR"
              git fetch origin main
              git reset --hard origin/main
            else
              rm -rf "$REPO_DIR"
              git clone "$REPO" "$REPO_DIR"
              cd "$REPO_DIR"
            fi

            echo "── Installing dependencies ──"
            cd "$REPO_DIR"

            # Search verification values are public meta-tag tokens, but are
            # managed as repository variables so they stay out of source.
            if [ -n "${GOOGLE_SITE_VERIFICATION:-}" ]; then
              if grep -q '^GOOGLE_SITE_VERIFICATION=' .env 2>/dev/null; then
                sed -i "s|^GOOGLE_SITE_VERIFICATION=.*|GOOGLE_SITE_VERIFICATION=\"$GOOGLE_SITE_VERIFICATION\"|" .env
              else
                echo "GOOGLE_SITE_VERIFICATION=\"$GOOGLE_SITE_VERIFICATION\"" >> .env
              fi
            fi
            if [ -n "${BING_SITE_VERIFICATION:-}" ]; then
              if grep -q '^BING_SITE_VERIFICATION=' .env 2>/dev/null; then
                sed -i "s|^BING_SITE_VERIFICATION=.*|BING_SITE_VERIFICATION=\"$BING_SITE_VERIFICATION\"|" .env
              else
                echo "BING_SITE_VERIFICATION=\"$BING_SITE_VERIFICATION\"" >> .env
              fi
            fi
            if [ -n "${CLOUDFLARE_RADAR_API_KEY:-}" ]; then
              if grep -q '^CLOUDFLARE_RADAR_API_KEY=' .env 2>/dev/null; then
                sed -i "s|^CLOUDFLARE_RADAR_API_KEY=.*|CLOUDFLARE_RADAR_API_KEY=\"$CLOUDFLARE_RADAR_API_KEY\"|" .env
              else
                echo "CLOUDFLARE_RADAR_API_KEY=\"$CLOUDFLARE_RADAR_API_KEY\"" >> .env
              fi
            fi

            npm install

            echo "── Generating Prisma client ──"
            npx prisma generate

            echo "── Building Next.js ──"
            npm run build

            echo "── Copying static assets to standalone ──"
            cp -r .next/static .next/standalone/.next/static
            cp -r public .next/standalone/public

            echo "── Cutting over from the legacy Docker instance on :3002 ──"
            # Idempotent — the container was removed on 2026-07-04; this
            # only matters if it ever comes back
            CID=$(docker ps -q --filter "publish=3002" 2>/dev/null || true)
            if [ -n "$CID" ]; then
              echo "Stopping legacy container $CID"
              docker stop "$CID"
              docker rm -f "$CID" || true
            fi

            echo "── Preparing database ──"
            # Stop the app before touching the DB so any relocation copies
            # a consistent snapshot. Downtime starts here.
            pm2 delete statusmonitor 2>/dev/null || true

            # The docker-era data/ directory can be root-owned: the existing
            # DB stays writable through its WAL, but nothing new can be
            # created there — schema changes then fail with SQLITE_READONLY.
            # In that case relocate the DB set into a directory we own.
            DB_FILE=""
            if [ -f "$REPO_DIR/db/monitor.db" ]; then
              DB_FILE="$REPO_DIR/db/monitor.db"
              echo "Using relocated database: db/monitor.db"
            elif [ -f "$REPO_DIR/data/monitor.db" ]; then
              DB_FILE="$REPO_DIR/data/monitor.db"
              if touch "$REPO_DIR/data/.writetest" 2>/dev/null; then
                rm -f "$REPO_DIR/data/.writetest"
                echo "Reusing existing database: data/monitor.db"
              else
                echo "data/ is not writable by $(id -un) — relocating DB to db/"
                ls -la "$REPO_DIR/data" || true
                mkdir -p "$REPO_DIR/db"
                cp "$DB_FILE" "$REPO_DIR/db/monitor.db"
                for ext in "-wal" "-shm"; do
                  [ -f "$DB_FILE$ext" ] && cp "$DB_FILE$ext" "$REPO_DIR/db/monitor.db$ext" || true
                done
                DB_FILE="$REPO_DIR/db/monitor.db"
              fi
            fi
            if [ -n "$DB_FILE" ]; then
              export DATABASE_URL="file:$DB_FILE"
              if grep -q '^DATABASE_URL=' .env 2>/dev/null; then
                sed -i "s|^DATABASE_URL=.*|DATABASE_URL=\"file:$DB_FILE\"|" .env
              else
                echo "DATABASE_URL=\"file:$DB_FILE\"" >> .env
              fi
            fi

            # EMAIL_FROM on the dead ducktyped.com domain breaks Resend
            # ("domain is not verified") — magic links and feedback mail
            if grep -q '^EMAIL_FROM=.*ducktyped\.com' .env 2>/dev/null; then
              echo "Fixing EMAIL_FROM (was on the unverified ducktyped.com domain)"
              sed -i 's|^EMAIL_FROM=.*|EMAIL_FROM="DTMonitor <alerts@ducktyped.xyz>"|' .env
            fi

            # Keep Auth.js redirects on the live .xyz domain. Older production
            # environments may still contain the retired ducktyped.com URL.
            if grep -q '^AUTH_URL=.*ducktyped\.com' .env 2>/dev/null; then
              echo "Fixing AUTH_URL (was on the retired ducktyped.com domain)"
              sed -i 's|^AUTH_URL=.*|AUTH_URL="https://monitor.ducktyped.xyz"|' .env
            fi

            echo "── Syncing database schema ──"
            npx prisma db push || {
              echo "db push failed — diagnostics:"
              id
              [ -n "$DB_FILE" ] && ls -la "$(dirname "$DB_FILE")" || true
              exit 1
            }

            # db push adds the new columns but does not execute the data
            # backfill contained in the formal migration. Keep this separate
            # and idempotent so databases created by older deploys are safe.
            echo "── Backfilling legacy signal classifications ──"
            npx prisma db execute --file prisma/backfill-signal-kinds.sql

            echo "── Starting PM2 ──"
            pm2 start ecosystem.config.js
            pm2 save

            echo "── Health check (local :3002) ──"
            sleep 3
            curl -sf http://127.0.0.1:3002/api/health || {
              echo "Health check failed!"
              pm2 logs statusmonitor --lines 20 --nostream
              exit 1
            }

            echo "── Health check (public URL) ──"
            # The public site must be serving the process we just started —
            # this is what caught the silent no-op deploys (March–July 2026)
            sleep 2
            PUB_UPTIME=$(curl -sf --max-time 15 https://monitor.ducktyped.xyz/api/health | grep -oE '"uptime":[0-9]+' | cut -d: -f2)
            echo "Public uptime: ${PUB_UPTIME:-unreachable}s"
            if [ -z "$PUB_UPTIME" ] || [ "$PUB_UPTIME" -gt 300 ]; then
              echo "ERROR: public site is not serving the new process (uptime=${PUB_UPTIME:-unreachable}s)."
              exit 1
            fi

            echo "── Deploy complete ──"
