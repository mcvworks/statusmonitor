name: Deploy Monitor

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            REPO="https://github.com/${{ github.repository }}.git"
            REPO_DIR="/home/dt_lower/monitor-repo"

            echo "── Pulling latest code ──"
            if [ -d "$REPO_DIR/.git" ]; then
              cd "$REPO_DIR"
              git fetch origin main
              git reset --hard origin/main
            else
              rm -rf "$REPO_DIR"
              git clone "$REPO" "$REPO_DIR"
              cd "$REPO_DIR"
            fi

            echo "── Installing dependencies ──"
            cd "$REPO_DIR"
            npm install

            echo "── Generating Prisma client ──"
            npx prisma generate

            echo "── Building Next.js ──"
            npm run build

            echo "── Copying static assets to standalone ──"
            cp -r .next/static .next/standalone/.next/static
            cp -r public .next/standalone/public

            echo "── Cutting over from the legacy Docker instance on :3002 ──"
            # nginx proxies monitor.ducktyped.xyz to 127.0.0.1:3002, which a
            # docker-compose container has held since March 2026. Downtime
            # starts here, so everything below stays fast.
            CID=$(docker ps -q --filter "publish=3002" 2>/dev/null || true)
            if [ -n "$CID" ]; then
              echo "Stopping legacy container $CID"
              docker stop "$CID"
              docker rm -f "$CID" || true
            fi

            # The container bind-mounted ./data — reuse its database so
            # alert history and user accounts carry over
            if [ -f "$REPO_DIR/data/monitor.db" ]; then
              echo "Reusing existing database: data/monitor.db"
              export DATABASE_URL="file:$REPO_DIR/data/monitor.db"
              if grep -q '^DATABASE_URL=' .env 2>/dev/null; then
                sed -i "s|^DATABASE_URL=.*|DATABASE_URL=\"file:$REPO_DIR/data/monitor.db\"|" .env
              else
                echo "DATABASE_URL=\"file:$REPO_DIR/data/monitor.db\"" >> .env
              fi
            fi

            echo "── Syncing database schema ──"
            npx prisma db push

            echo "── Reloading PM2 ──"
            pm2 delete statusmonitor 2>/dev/null || true
            pm2 start ecosystem.config.js
            pm2 save

            echo "── Health check (local :3002) ──"
            sleep 3
            curl -sf http://127.0.0.1:3002/api/health || {
              echo "Health check failed!"
              pm2 logs statusmonitor --lines 20 --nostream
              exit 1
            }

            echo "── Health check (public URL) ──"
            # The public site must be serving the process we just started —
            # this is what caught the silent no-op deploys (March–July 2026)
            sleep 2
            PUB_UPTIME=$(curl -sf --max-time 15 https://monitor.ducktyped.xyz/api/health | grep -oE '"uptime":[0-9]+' | cut -d: -f2)
            echo "Public uptime: ${PUB_UPTIME:-unreachable}s"
            if [ -z "$PUB_UPTIME" ] || [ "$PUB_UPTIME" -gt 300 ]; then
              echo "ERROR: public site is not serving the new process (uptime=${PUB_UPTIME:-unreachable}s)."
              exit 1
            fi

            echo "── Deploy complete ──"
