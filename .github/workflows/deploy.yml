name: Deploy Monitor

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            REPO="https://github.com/${{ github.repository }}.git"
            REPO_DIR="/home/dt_lower/monitor-repo"

            echo "── Pulling latest code ──"
            if [ -d "$REPO_DIR/.git" ]; then
              cd "$REPO_DIR"
              git fetch origin main
              git reset --hard origin/main
            else
              rm -rf "$REPO_DIR"
              git clone "$REPO" "$REPO_DIR"
              cd "$REPO_DIR"
            fi

            echo "── Installing dependencies ──"
            cd "$REPO_DIR"
            npm install

            echo "── Running database migrations ──"
            npx prisma generate
            npx prisma db push

            echo "── Building Next.js ──"
            npm run build

            echo "── Copying static assets to standalone ──"
            cp -r .next/static .next/standalone/.next/static
            cp -r public .next/standalone/public

            echo "── Reloading PM2 ──"
            pm2 delete statusmonitor 2>/dev/null || true
            pm2 start ecosystem.config.js
            pm2 save

            echo "── Health check (local) ──"
            sleep 3
            curl -sf http://127.0.0.1:3001/api/health || {
              echo "Health check failed!"
              pm2 logs statusmonitor --lines 20 --nostream
              exit 1
            }

            echo "── Health check (public URL) ──"
            # The public site is known to be served by a DIFFERENT process
            # than this deployment (uptime dates to March 2026) — warn until
            # the routing is fixed, see .github/workflows/diagnose.yml
            PUB_UPTIME=$(curl -sf --max-time 15 https://monitor.ducktyped.xyz/api/health | grep -oE '"uptime":[0-9]+' | cut -d: -f2)
            echo "Public uptime: ${PUB_UPTIME:-unreachable}s"
            if [ -z "$PUB_UPTIME" ] || [ "$PUB_UPTIME" -gt 300 ]; then
              echo "WARNING: public site is NOT serving this deployment (uptime=${PUB_UPTIME:-unreachable}s)."
              echo "Visitors are still getting an old build until nginx routing is fixed."
            fi

            echo "── Deploy complete ──"
